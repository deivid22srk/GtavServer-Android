name: build

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Permissão de execução ao gradlew
        run: chmod +x gradlew

      - name: Testes de paridade do core (Kotlin vs serve_local.py original)
        run: ./gradlew --no-daemon :core:test

      - name: Build APK debug
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Build APK release (assinado com debug keystore)
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Publicar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: GtavServer-Android-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download dos APKs
        uses: actions/download-artifact@v4
        with:
          name: GtavServer-Android-apks
          path: apks

      - name: Criar release com os APKs
        uses: softprops/action-gh-release@v2
        with:
          files: apks/**/*.apk
          generate_release_notes: true
